<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineZone</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">
        <div>
            <h1>⛏️ MineZone</h1>
            <p>Small Steps · <b>Big Rewards</b></p>
        </div>

        <div class="online">
            <span></span> Online
        </div>
    </header>

    <section class="balance-card">

        <div class="coin">⭐</div>

        <div class="balance-info">
            <small>Your Balance</small>
            <h2 id="balance">125.00</h2>
        </div>

        <div class="arrow">›</div>

    </section>

    <section class="mining-card">

        <div class="mining-top">

            <div>
                <small>⏱️ Next Mining In</small>
                <h3 id="timer">Ready!</h3>
            </div>

            <div class="pickaxe">⛏️</div>

        </div>

        <button id="mineBtn" class="mine-btn">
            Start Mining
        </button>

        <p class="reward">+10 Points</p>

    </section>

    <section class="features">

        <button class="feature" onclick="claimBonus()">
            <span>🎁</span>
            <b>Daily Bonus</b>
        </button>

        <button class="feature" onclick="showMessage('Tasks')">
            <span>📋</span>
            <b>Tasks</b>
        </button>

        <button class="feature" onclick="showMessage('Referral')">
            <span>👥</span>
            <b>Referral</b>
        </button>

        <button class="feature" onclick="showMessage('Withdraw')">
            <span>👛</span>
            <b>Withdraw</b>
        </button>

        <button class="feature" onclick="showMessage('History')">
            <span>📄</span>
            <b>History</b>
        </button>

        <button class="feature" onclick="showMessage('Leaderboard')">
            <span>🏆</span>
            <b>Leaderboard</b>
        </button>

        <button class="feature" onclick="showMessage('Profile')">
            <span>👤</span>
            <b>Profile</b>
        </button>

        <button class="feature" onclick="showMessage('Help')">
            <span>❓</span>
            <b>Help</b>
        </button>

    </section>

    <section class="invite" onclick="showMessage('Invite Friends')">

        <div class="invite-icon">👑</div>

        <div>
            <h3>Invite Friends</h3>
            <p>Get 10% bonus from their earnings!</p>
        </div>

        <div class="arrow">›</div>

    </section>

    <nav class="bottom-nav">

        <button class="active">
            <span>⌂</span>
            Home
        </button>

        <button onclick="showMessage('Mining')">
            <span>⛏️</span>
            Mining
        </button>

        <button onclick="showMessage('Balance')">
            <span>🪙</span>
            Balance
        </button>

        <button onclick="showMessage('Tasks')">
            <span>📋</span>
            Tasks
        </button>

        <button onclick="showMessage('More')">
            <span>•••</span>
            More
        </button>

    </nav>

</div>

<div id="toast" class="toast"></div>

<script src="script.js?v=4?v=3"></script>

</body>
</html>
